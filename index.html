<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Startline</title>
<link rel="apple-touch-icon" href="startline-icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one phone-width column; questions are "lanes" on a running track, the finished plan is a bar chart of weeks to the start line. */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --ink:#141B2D; --muted:#5A6378; --line:#D8DDE7;
  --track:#2D4DB3; --track-soft:#E3E8F6; --mark:#E6AE17; --mark-ink:#352600;
  --good:#2C7A57; --warn:#AE4F18; --warn-soft:#FBEADD;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1423; --surface:#162036; --ink:#E6EAF4; --muted:#98A2B9; --line:#29344E;
  --track:#7C95EE; --track-soft:#1D2946; --mark:#F1C84B; --mark-ink:#2A1E00;
  --good:#5BC393; --warn:#EF9A62; --warn-soft:#3A2618; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0E1423; --surface:#162036; --ink:#E6EAF4; --muted:#98A2B9; --line:#29344E;
  --track:#7C95EE; --track-soft:#1D2946; --mark:#F1C84B; --mark-ink:#2A1E00;
  --good:#5BC393; --warn:#EF9A62; --warn-soft:#3A2618; color-scheme:dark; }

*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;margin:0;padding:env(safe-area-inset-top,0px) 16px calc(48px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:620px;margin:0 auto}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--track);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 10px}
.brand{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:.5px;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.brand img{width:40px;height:40px;border-radius:10px;flex:0 0 auto}
.brand-text{display:flex;flex-direction:column;line-height:1}
.brand-text small{font-family:var(--f-body);font-weight:600;font-size:12px;letter-spacing:1.4px;color:var(--muted);text-transform:uppercase;margin-top:3px}
.lanes{display:flex;gap:4px}
.lane{width:34px;height:34px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);font-family:var(--f-display);font-weight:700;font-size:17px;color:var(--muted);padding:0}
.lane.done{border-color:var(--track);color:var(--track)}
.lane.on{background:var(--track);border-color:var(--track);color:var(--surface)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 20px;display:flex;flex-direction:column;gap:18px}
.step-head{display:flex;align-items:flex-start;gap:14px}
.lane-no{font-family:var(--f-display);font-weight:800;font-size:56px;line-height:.8;color:transparent;-webkit-text-stroke:2px var(--track);min-width:36px}
.step-head h2{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.05;margin:0;text-wrap:balance;letter-spacing:.2px}
.step-head p{margin:6px 0 0;color:var(--muted);font-size:15px}
.field{display:flex;flex-direction:column;gap:7px}
.field > span{font-weight:600;font-size:14px}
.field small{color:var(--muted);font-size:13px}
input[type=text],input[type=number],input[type=date],select{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px}
input:focus,select:focus{border-color:var(--track);outline:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:9px 15px;font-weight:600;font-size:15px}
.chip[aria-pressed="true"]{background:var(--track);border-color:var(--track);color:var(--surface)}
.chip.day{min-width:52px;border-radius:10px;padding:9px 0;text-align:center}
.toggle{display:flex;align-items:flex-start;gap:12px;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}
.toggle input{width:22px;height:22px;margin-top:2px;accent-color:var(--track);flex:0 0 auto}
.ranges{display:flex;flex-direction:column;gap:8px}
.range{display:grid;grid-template-columns:1fr 1fr 40px;gap:8px;align-items:center}
.icon-btn{width:40px;height:44px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--muted);font-size:18px}
.link-btn{align-self:flex-start;background:none;border:none;color:var(--track);font-weight:600;padding:4px 0}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:4px}
.btn{border:none;border-radius:12px;padding:13px 20px;font-weight:700;font-size:16px}
.btn.primary{background:var(--track);color:var(--surface)}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.wide{width:100%}

.startline{height:6px;background:var(--mark);border-radius:3px;margin-block:2px 4px}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:44px;line-height:.95;text-transform:uppercase;margin:0;text-wrap:balance}
.hero p{margin:0;color:var(--muted)}
.disclaimer{font-size:14px;color:var(--muted);border-left:3px solid var(--mark);padding-left:12px}

.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--bg);border-radius:12px;padding:10px 8px;text-align:center}
.stat b{display:block;font-family:var(--f-display);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
@media (max-width:420px){.summary{grid-template-columns:repeat(2,1fr)}}
.alert{border-radius:12px;padding:12px 14px;font-size:14.5px}
.alert.warn{background:var(--warn-soft);color:var(--ink);border:1.5px solid var(--warn)}
.alert.warn strong{color:var(--warn)}
.alert.info{background:var(--track-soft)}
.alert.prominent{font-size:15.5px;padding:14px 16px}
.chart-box{overflow-x:auto}
.chart-box svg{display:block;width:100%;height:auto;min-width:320px}
.ax{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.grid{stroke:var(--line);stroke-width:1}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.weeks{display:flex;flex-direction:column;gap:8px}
details.wk{background:var(--surface);border:1px solid var(--line);border-radius:12px}
details.wk[open]{border-color:var(--track)}
details.wk summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px 14px}
details.wk summary::-webkit-details-marker{display:none}
.wk-no{font-family:var(--f-display);font-weight:700;font-size:22px;color:var(--track);min-width:34px}
.wk-mid{flex:1;min-width:0}
.wk-mid div:first-child{font-weight:600;font-size:15px}
.wk-mid div:last-child{font-size:13px;color:var(--muted)}
.wk-km{font-family:var(--f-display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.tag.cut{background:var(--track-soft);color:var(--track)}
.tag.hol{background:var(--mark);color:var(--mark-ink)}
.tag.busy{background:var(--warn-soft);color:var(--warn)}
.tag.race{background:var(--mark);color:var(--mark-ink)}
.days{border-top:1px solid var(--line);padding:6px 14px 12px}
.day{display:grid;grid-template-columns:56px 1fr auto;gap:10px;padding-block:9px;border-bottom:1px dashed var(--line);align-items:start}
.day:last-child{border-bottom:none}
.day .d{font-weight:700;font-size:14px}
.day .d small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.day .t{font-weight:600;font-size:15px}
.day .t p{margin:2px 0 0;font-weight:400;font-size:13.5px;color:var(--muted)}
.day .k{font-family:var(--f-display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.day.rest .t{color:var(--muted);font-weight:500}
.day.long .t{color:var(--track)}
.day.race .t{color:var(--warn)}
h3{font-family:var(--f-display);font-weight:700;font-size:22px;margin:4px 0 0;letter-spacing:.3px}
.below{margin-top:22px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><img src="startline-icon-180.png" alt=""><span class="brand-text">Startline<small>Get race ready</small></span></div>
    <nav class="lanes" id="lanes" aria-label="Steps"></nav>
  </header>
  <main id="screen"></main>
</div>
<script>
/* ---------------- dates ---------------- */
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const DAY_FULL=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{ if(!s) return null; const [y,m,d]=String(s).split('-').map(Number); if(!y||!m||!d) return null; return new Date(y,m-1,d); };
const addDays=(d,n)=>{ const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const mondayOf=d=>{ const x=new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; };
const dow=d=>(d.getDay()+6)%7; // 0 = Mon
const fmt=d=>d?d.toLocaleDateString('en-AU',{day:'numeric',month:'short'}):'';
const fmtLong=d=>d?d.toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short',year:'numeric'}):'';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const today=new Date(); today.setHours(0,0,0,0);

/* ---------------- answers (empty until the runner fills them in) ---------------- */
function blankAnswers(){
  return {
    agreed:false,
    dist:'', raceName:'', raceDate:'',
    goal:'', goalTime:'',
    weekly:'', longest:'', injured:false,
    runDays:[], longDay:null, longDayPicked:false, strDays:[],
    busy:[], hols:[],
    planStart:''
  };
}
let S=blankAnswers();
let step=0;
let mode='questions';
let savedPlan=null;
let saveOk=true;

/* ---------------- storage ---------------- */
const KEY='startline';
let mem=null;
function loadStore(){
  try{
    const raw=localStorage.getItem(KEY);
    if(!raw) return mem||{};
    const o=JSON.parse(raw);
    return (o && typeof o==='object') ? o : {};
  }catch(e){ return mem||{}; }
}
function saveStore(obj){
  mem=obj;
  try{ localStorage.setItem(KEY, JSON.stringify(obj)); return true; }
  catch(e){ return false; }
}
function snapshotAnswers(){
  return {
    dist:S.dist, raceName:S.raceName, raceDate:S.raceDate,
    goal:S.goal, goalTime:S.goalTime,
    weekly:S.weekly, longest:S.longest, injured:!!S.injured,
    runDays:[...S.runDays], longDay:S.longDay, longDayPicked:!!S.longDayPicked, strDays:[...S.strDays],
    busy:S.busy.map(r=>({from:r.from||'', to:r.to||''})),
    hols:S.hols.map(r=>({from:r.from||'', to:r.to||''})),
    planStart:S.planStart||''
  };
}
function applyAnswers(a){
  if(!a || typeof a!=='object') return;
  S.dist=a.dist||'';
  S.raceName=a.raceName||'';
  S.raceDate=a.raceDate||'';
  S.goal=a.goal||'';
  S.goalTime=a.goalTime||'';
  S.weekly=(a.weekly===0 || a.weekly) ? a.weekly : '';
  S.longest=(a.longest===0 || a.longest) ? a.longest : '';
  S.injured=!!a.injured;
  S.runDays=Array.isArray(a.runDays)?a.runDays.map(Number).filter(n=>n>=0&&n<=6):[];
  S.longDay=(a.longDay===0 || a.longDay) ? +a.longDay : null;
  S.longDayPicked=!!a.longDayPicked;
  if(!S.longDayPicked && S.longDay!=null && S.runDays.includes(S.longDay) && S.longDay!==defaultLongDay(S.runDays)) S.longDayPicked=true;
  if(!S.longDayPicked) S.longDay=defaultLongDay(S.runDays);
  S.strDays=Array.isArray(a.strDays)?a.strDays.map(Number).filter(n=>n>=0&&n<=6):[];
  S.busy=Array.isArray(a.busy)?a.busy.map(r=>({from:(r&&r.from)||'', to:(r&&r.to)||''})):[];
  S.hols=Array.isArray(a.hols)?a.hols.map(r=>({from:(r&&r.from)||'', to:(r&&r.to)||''})):[];
  S.planStart=a.planStart||'';
}
function persistDraft(){
  if(mode==='tracker') return;
  const cur=loadStore();
  if(cur && cur.plan) return;
  saveStore({v:1, agreed:!!S.agreed, answers:snapshotAnswers(), draftStep:step});
}

/* ---------------- the plan rules ---------------- */
const CFG={
  '10k': {label:'10 km',          km:10,   taper:1, minWeeks:6,  ideal:10, peakLong:{finish:10,time:13}, peakWeekly:{finish:25,time:35}, taperF:[]},
  'half':{label:'half marathon',  km:21.1, taper:2, minWeeks:8,  ideal:14, peakLong:{finish:18,time:20}, peakWeekly:{finish:35,time:45}, taperF:[[0.65,0.7]]},
  'full':{label:'marathon',       km:42.2, taper:3, minWeeks:14, ideal:20, peakLong:{finish:30,time:32}, peakWeekly:{finish:48,time:58}, taperF:[[0.75,0.8],[0.5,0.6]]}
};
const SHARE={3:.5,4:.38,5:.33,6:.30,7:.27};
const inc=l=> l<10?1 : l<20?1.5 : 2;
const r1=x=>Math.round(x);
const overlaps=(mon,ranges)=>ranges.some(rg=>{ const a=parse(rg.from), b=parse(rg.to)||a; if(!a) return false; return a<=addDays(mon,6) && b>=mon; });
function planStartMonday(s){
  if(s && s.planStart){
    const anchored=parse(s.planStart);
    if(anchored) return mondayOf(anchored);
  }
  let start=mondayOf(today);
  if(dow(today)!==0) start=addDays(start,7);
  return start;
}
function goalPace(s){
  const m=/^(\d+):(\d{1,2})$/.exec((s.goalTime||'').trim()); if(!m) return null;
  if(+m[2]>59) return null;
  if(!CFG[s.dist]) return null;
  const sec=(+m[1]*60 + +m[2])*60/CFG[s.dist].km;
  return Math.floor(sec/60)+':'+pad(Math.round(sec%60));
}
function pickQualityDay(days,longDay){
  const cands=days.filter(d=>d!==longDay); if(!cands.length) return null;
  const circ=(a,b)=>{ const x=Math.abs(a-b); return Math.min(x,7-x); };
  const pref=[2,3,1,4,0,5,6];
  return cands.sort((a,b)=> circ(b,longDay)-circ(a,longDay) || pref.indexOf(a)-pref.indexOf(b))[0];
}
function defaultLongDay(days){
  if(days.includes(6)) return 6;
  if(days.includes(5)) return 5;
  return days.length ? Math.max(...days) : null;
}
function syncLongDay(){
  if(S.longDayPicked && S.runDays.includes(S.longDay)) return;
  S.longDayPicked=false;
  S.longDay=defaultLongDay(S.runDays);
}
function weeksUntil(s){
  const race=parse(s.raceDate);
  if(!race || !CFG[s.dist]) return null;
  const start=planStartMonday(s);
  const raceMon=mondayOf(race);
  return Math.round((raceMon-start)/864e5/7)+1;
}

function buildPlan(s){
  const C=CFG[s.dist];
  if(!C) return {error:'Pick a distance.'};
  const start=planStartMonday(s);
  const race=parse(s.raceDate);
  if(!race) return {error:'Add your race date.'};
  const raceMon=mondayOf(race);
  const n=Math.round((raceMon-start)/864e5/7)+1;
  if(!(n>=2)) return {error:'Your race date needs to be at least two weeks away.'};
  const days=[...s.runDays].sort((a,b)=>a-b);
  if(days.length<3) return {error:'Choose at least three running days.'};
  const longDay=days.includes(s.longDay)?s.longDay:days[days.length-1];
  const qDay=pickQualityDay(days,longDay);
  const share=SHARE[days.length];
  const target=C.peakLong[s.goal], peakCap=C.peakWeekly[s.goal];
  const inj=s.injured?0.85:1;
  const pace=s.goal==='time'?goalPace(s):null;

  let L0=Math.max(3,+s.longest||0)*inj;
  let W0=Math.max((+s.weekly||0)*inj, L0+(days.length-1)*3);
  const buildN=n-C.taper;                    // weeks before the taper (includes week 1)
  const pre=Math.max(0, buildN-C.ideal);     // extra weeks before the build begins: hold steady
  const weeks=[]; let lastL=L0, lastW=W0, peakL=0, peakW=0, sinceCut=0;

  for(let i=0;i<n;i++){
    const mon=addDays(start,7*i);
    const busy=overlaps(mon,s.busy), hol=overlaps(mon,s.hols);
    let phase, l, w, cut=false;
    if(i===n-1){ phase='Race week'; }
    else if(i>=buildN){ phase='Taper'; const f=C.taperF[i-buildN]||[0.5,0.6]; l=peakL*f[0]; w=peakW*f[1]; }
    else if(i===0){ phase=pre>0?'Base':'Build'; l=L0; w=W0; }
    else {
      // lighter week every fourth week, or on a busy week (which resets the count); never the week before the taper
      cut = busy || (sinceCut>=3 && i!==buildN-1);
      sinceCut = cut ? 0 : sinceCut+1;
      phase = i<pre ? 'Base' : ((i-pre) < 0.6*(buildN-pre) ? 'Build' : 'Peak');
      if(cut){ l=lastL*0.75; w=lastW*0.8; }
      else if(i<pre){ l=Math.min(target,lastL+0.5); w=lastW*1.03; lastL=l; lastW=w; }
      else{
        l=Math.min(target, lastL+inc(lastL), lastL*1.12+0.5);
        w=Math.min(Math.max(peakCap,lastW), lastW*(hol?1.12:1.08));
        w=Math.max(w, Math.min(l/share, lastW*1.1));
        l=Math.min(l, w*0.5);
        lastL=l; lastW=w;
      }
    }
    if(phase!=='Race week' && phase!=='Taper'){ peakL=Math.max(peakL,l); peakW=Math.max(peakW,w); }
    weeks.push({i, mon, phase, l, w, cut, busy, hol});
  }

  // turn each week into days
  const injEarly=i=>s.injured && i<4;
  weeks.forEach(wk=>{
    const runs=[];
    if(wk.phase==='Race week'){
      const rd=dow(race);
      const before=days.filter(d=>d<rd).slice(-2);
      before.forEach((d,k)=>runs.push({d, type:k===0?'quality':'easy', km:k===0?5:3,
        title:k===0?'Easy + race-effort touches':'Shakeout', desc:k===0?'Easy, with 4 × 1 min at race effort.':'Very easy. Lay out your race kit tonight.'}));
      runs.push({d:rd, type:'race', km:C.km, title:'Race day: '+(s.raceName||C.label), desc:pace?'Goal pace '+pace+'/km. Start a little slower than that.':'Start slower than feels right, and enjoy it.'});
    } else {
      const l=Math.max(3,r1(wk.l)), others=days.length-1;
      const rest=Math.max(0, wk.w-l), unit=rest/((others-1)+1.2);
      const qkm=Math.max(3,r1(unit*1.2)), ekm=Math.max(3,r1(unit));
      const p=buildPhasePos(wk.i);
      function buildPhasePos(i){ return (i-pre)/Math.max(1,buildN-pre); }
      let qT,qD;
      if(wk.phase==='Taper'){ qT='Short and sharp'; qD='Easy, with 4 × 2 min at race effort.'; }
      else if(wk.cut||wk.phase==='Base'||injEarly(wk.i)){ qT='Easy + strides'; qD='Easy run, then 6 × 20 sec relaxed strides with full recovery between.'; }
      else if(wk.phase==='Build'){ qT='Tempo'; qD = p<0.25?'Easy start, 2 × 8 min comfortably hard, easy finish.':p<0.45?'Easy start, 2 × 10 min comfortably hard, easy finish.':'Easy start, 20 min comfortably hard, easy finish.'; }
      else { qT=pace?'Goal pace':'Steady'; qD=pace?('Easy start, then '+Math.min(8,Math.max(2,r1(qkm*0.6)))+' km at '+pace+'/km, easy finish.'):'Easy start, 25 min comfortably hard, easy finish.'; }
      let lD;
      if(wk.cut) lD='Shorter this week on purpose. Easy all the way.';
      else if(wk.phase==='Taper') lD='Shorter and easy. Trust the training.';
      else if(wk.phase==='Peak' && pace && s.dist!=='10k' && wk.i%2===0) lD='Easy, with the last 3–5 km at goal pace ('+pace+'/km).';
      else if(wk.phase==='Peak' && s.dist!=='10k') lD='Easy. Practise the drinks and food you\'ll use on race day.';
      else lD='Easy and conversational. Walk breaks are fine.';
      days.forEach(d=>{
        if(d===longDay) runs.push({d, type:'long', km:l, title:'Long run', desc:lD});
        else if(d===qDay) runs.push({d, type:'quality', km:qkm, title:qT, desc:qD});
        else runs.push({d, type:'easy', km:ekm, title:'Easy', desc:'Relaxed pace. You should be able to chat.'});
      });
    }
    wk.runs=runs;
    wk.total=runs.reduce((a,r)=>a+r.km,0);
  });

  // warnings
  const warnings=[];
  const realPeakL=Math.max(...weeks.filter(w=>w.phase!=='Race week').map(w=>w.runs.find(r=>r.type==='long')?.km||0));
  if(n<C.minWeeks) warnings.push({kind:'warn', head:n+' weeks is short for a '+C.label+'.', body:'Most plans use '+C.ideal+' weeks or more. This plan is squeezed, so listen to your body and skip a run rather than push through.'});
  if(s.dist!=='10k' && realPeakL < target*0.85){
    let l=L0,c=0; while(l<target && c<104){ c++; if((c+1)%4===0) continue; l+=inc(l); }
    const earliest=addDays(start, 7*(c+1+C.taper));
    warnings.push({kind:'warn', head:'Not enough time to build up safely.', body:'The longest run this plan can safely reach is '+realPeakL+' km. For a '+C.label+' you\'d want about '+target+' km. A race from the week of '+fmt(earliest)+' '+earliest.getFullYear()+' would give you time'+(s.dist==='full'?', or this date could suit a half marathon instead.':'.')});
  }
  if(s.injured) warnings.push({kind:'info', head:'Easing back in.', body:'This plan starts 15% below your current running and keeps the faster day to strides for the first four weeks. Your physio\'s advice comes first.'});
  if(s.goal==='time' && !pace) warnings.push({kind:'info', head:'Goal time not read.', body:'Enter it as hours:minutes, like 1:55.'});

  return {weeks, warnings, n, start, race, days, longDay, qDay, peakL:realPeakL, peakW:Math.max(...weeks.map(w=>w.total)), pace};
}

function serializePlan(P){
  return {
    n:P.n, days:P.days, longDay:P.longDay, qDay:P.qDay,
    peakL:P.peakL, peakW:P.peakW, pace:P.pace||null,
    warnings:P.warnings||[],
    start:iso(P.start), race:iso(P.race),
    weeks:P.weeks.map(wk=>({
      i:wk.i, mon:iso(wk.mon), phase:wk.phase,
      l:wk.l, w:wk.w, cut:!!wk.cut, busy:!!wk.busy, hol:!!wk.hol,
      total:wk.total,
      runs:(wk.runs||[]).map(r=>({d:r.d, type:r.type, km:r.km, title:r.title, desc:r.desc}))
    }))
  };
}
function hydratePlan(p){
  if(!p || !Array.isArray(p.weeks) || !p.weeks.length) return null;
  const start=parse(p.start), race=parse(p.race);
  if(!start || !race) return null;
  return {
    n:p.n, start, race, days:p.days||[], longDay:p.longDay, qDay:p.qDay,
    peakL:p.peakL, peakW:p.peakW, pace:p.pace||null,
    warnings:Array.isArray(p.warnings)?p.warnings:[],
    weeks:p.weeks.map(wk=>({
      i:wk.i, mon:parse(wk.mon), phase:wk.phase,
      l:wk.l, w:wk.w, cut:!!wk.cut, busy:!!wk.busy, hol:!!wk.hol,
      total:wk.total,
      runs:(wk.runs||[]).map(r=>({d:r.d, type:r.type, km:r.km, title:r.title, desc:r.desc}))
    }))
  };
}

/* ---------------- validation ---------------- */
function rangesOk(list){
  return list.every(r=>{
    const a=parse(r.from), b=parse(r.to);
    return !!(a && b && a<=b);
  });
}
function stepValid(n){
  if(n===0) return !!S.agreed;
  if(n===1) return weeksUntil(S)>=2;
  if(n===2){
    if(S.goal==='finish') return true;
    if(S.goal==='time') return !!goalPace(S);
    return false;
  }
  if(n===3){
    if(S.weekly==='' || S.longest==='') return false;
    const w=+S.weekly, l=+S.longest;
    return Number.isFinite(w) && w>=0 && w<=150 && Number.isFinite(l) && l>=0 && l<=45;
  }
  if(n===4) return S.runDays.length>=3 && S.runDays.includes(S.longDay);
  if(n===5) return rangesOk(S.busy) && rangesOk(S.hols);
  return true;
}
function canGo(s){
  if(s<=0) return true;
  for(let i=0;i<s;i++) if(!stepValid(i)) return false;
  return true;
}
function firstIncomplete(){
  for(let i=0;i<=5;i++) if(!stepValid(i)) return i;
  return 6;
}

function ranges(key){
  if(!S[key].length) return `<small>None added.</small>`;
  return S[key].map((r,k)=>`<div class="range">
      <input type="date" id="${key}-from-${k}" aria-label="From" value="${fieldVal(r.from)}" data-rk="${key}" data-ri="${k}" data-rf="from">

      <button class="icon-btn" type="button" aria-label="Remove" data-rm="${key}" data-ri="${k}">×</button></div>`).join('');
}

function isTimeWarning(w){ return w && String(w.head||'').indexOf('Not enough time')===0; }

function planMarkup(P){
  const C=CFG[S.dist];
  let maxW=Math.ceil(Math.max(...P.weeks.map(w=>w.total))/10)*10;
  if(!maxW) maxW=10;
  const VW=600, VH=190, padL=30, padR=6, padT=10, padB=22;
  const bw=(VW-padL-padR)/P.n, y=v=>padT+(VH-padT-padB)*(1-v/maxW);
  let svg=`<svg viewBox="0 0 ${VW} ${VH}" role="img" aria-label="Weekly kilometres for each week of the plan">`;
  for(let g=0; g<=maxW; g+=10){ svg+=`<line class="grid" x1="${padL}" x2="${VW-padR}" y1="${y(g)}" y2="${y(g)}"/><text class="ax" x="${padL-6}" y="${y(g)+3}" text-anchor="end">${g}</text>`; }
  P.weeks.forEach((w,i)=>{
    const x=padL+i*bw+bw*0.12, wd=bw*0.76;
    const isRace=w.phase==='Race week';
    const lk=isRace?0:(w.runs.find(r=>r.type==='long')?.km||0);
    const op=w.cut?0.45:1;
    svg+=`<rect x="${x}" y="${y(w.total)}" width="${wd}" height="${y(0)-y(w.total)}" rx="2" fill="${isRace?'var(--mark)':'var(--track)'}" opacity="${isRace?1:op*0.35}"/>`;
    if(!isRace) svg+=`<rect x="${x}" y="${y(lk)}" width="${wd}" height="${y(0)-y(lk)}" rx="2" fill="var(--track)" opacity="${op}"/>`;
    if(w.hol) svg+=`<circle cx="${x+wd/2}" cy="${y(w.total)-5}" r="2.5" fill="var(--mark)"/>`;
    if(i===0||(i+1)%4===0||i===P.n-1) svg+=`<text class="ax" x="${x+wd/2}" y="${VH-7}" text-anchor="middle">${i+1}</text>`;
  });
  svg+=`</svg>`;

  const weeks=P.weeks.map((w,i)=>{
    const tags=(w.phase==='Race week'?'<span class="tag race">Race</span>':'')+(w.cut?'<span class="tag cut">Lighter</span>':'')+(w.hol?'<span class="tag hol">Holiday</span>':'')+(w.busy?'<span class="tag busy">Busy</span>':'');
    const lk=w.runs.find(r=>r.type==='long');
    const rows=DAYS.map((d,di)=>{
      const date=w.mon?addDays(w.mon,di):null, run=w.runs.find(r=>r.d===di);
      const dd=`<div class="d">${d}<small>${date?date.getDate()+'/'+(date.getMonth()+1):''}</small></div>`;
      if(run) return `<div class="day ${esc(run.type)}">${dd}<div class="t">${esc(run.title)}<p>${esc(run.desc)}</p></div><div class="k">${esc(run.km)}<small style="font-size:12px"> km</small></div></div>`;
      if(S.strDays.includes(di)) return `<div class="day rest">${dd}<div class="t">Strength</div><div></div></div>`;
      return `<div class="day rest">${dd}<div class="t">Rest</div><div></div></div>`;
    }).join('');
    return `<details class="wk" ${i===0?'open':''}><summary><span class="wk-no">${i+1}</span><span class="wk-mid"><div>${fmt(w.mon)} – ${fmt(w.mon?addDays(w.mon,6):null)}${tags}</div><div>${esc(w.phase)}${lk?' · long run '+esc(lk.km)+' km':''}</div></span><span class="wk-km">${esc(w.total)} km</span></summary><div class="days">${rows}</div></details>`;
  }).join('');

  const timeWarn=(P.warnings||[]).filter(isTimeWarning);
  const other=(P.warnings||[]).filter(w=>!isTimeWarning(w));
  const title=S.raceName||('Your '+(C?C.label:'race'));
  const sub=fmtLong(P.race)+' · '+(S.goal==='time'&&P.pace?('goal '+S.goalTime+', about '+P.pace+'/km'):'goal: finish comfortably');
  return {svg, weeks, timeWarn, other, title, sub, C};
}

function planScreen(kind){
  const P = kind==='saved' ? savedPlan : buildPlan(S);
  if(!P) return `<section class="panel">${head('!','Almost there','The saved plan could not be read.')}</section>`;
  if(P.error) return `<section class="panel">${head('!', 'Almost there', P.error)}<div class="nav"><button class="btn ghost" id="back" type="button">Back</button><span></span></div></section>`;
  const M=planMarkup(P);
  const timeHTML=M.timeWarn.map(w=>alertHTML(w,true)).join('');
  const otherHTML=M.other.map(w=>alertHTML(w)).join('');
  const savedNote = kind==='saved'
    ? `<div class="alert info">${saveOk?'This plan is saved on this phone. Next time you open Startline, you will come straight here.':'<strong>Could not save on this phone.</strong> The plan is only in this tab. Check that the browser is allowed to store site data.'}</div>`
    : '';
  const actions = kind==='saved'
    ? ''
    : `${timeHTML}<div class="nav"><button class="btn ghost" id="back" type="button">Edit answers</button><button class="btn primary" id="startPlan" type="button">Start this plan</button></div>`;
  const erase = kind==='saved'
    ? `<div class="below" id="eraseBox"><button class="btn ghost wide" id="askErase" type="button">Erase plan and start again</button></div>`
    : '';
  return `<section class="panel">
      ${head('', M.title, M.sub)}
      ${savedNote}
      ${kind==='saved'?timeHTML:''}
      <div class="summary">
        <div class="stat"><b>${esc(P.n)}</b><span>weeks</span></div>
        <div class="stat"><b>${esc(P.days.length)}</b><span>runs a week</span></div>
        <div class="stat"><b>${esc(P.peakL)}</b><span>km longest run</span></div>
        <div class="stat"><b>${esc(P.peakW)}</b><span>km biggest week</span></div>
      </div>
      ${otherHTML}
      <div><h3>The build</h3><div class="chart-box">${M.svg}</div>
      <div class="legend"><span><i style="background:var(--track)"></i>Long run</span><span><i style="background:var(--track);opacity:.35"></i>Rest of the week</span><span><i style="background:var(--mark)"></i>Race week</span><span>Faded bars are lighter weeks</span></div></div>
      ${actions}
    </section>
    <h3 class="below">Week by week</h3>
    <div class="weeks" style="margin-top:10px">${M.weeks}</div>
    ${erase}`;
}

function beginPlan(){
  const built=buildPlan(S);
  if(built.error){ render(); return; }
  S.planStart=iso(built.start);
  const prev=loadStore();
  const payload={
    v:1,
    agreed:true,
    answers:snapshotAnswers(),
    plan:serializePlan(built),
    log:(prev && prev.log) || {},
    updatedAt:Date.now()
  };
  saveOk=saveStore(payload);
  savedPlan=hydratePlan(payload.plan);
  mode='tracker';
  render();
}
function erasePlan(){
  S=blankAnswers();
  S.agreed=true;
  savedPlan=null;
  mode='questions';
  step=0;
  saveOk=saveStore({v:1, agreed:true});
  render();
}

/* ---------------- render + events ---------------- */
function paintLanes(){
  const el=$('#lanes');
  if(!el) return;
  if(mode==='tracker'){ el.innerHTML=''; return; }
  el.innerHTML=STEPS.slice(1).map((t,k)=>{
    const s=k+1;
    const cls=s===step?'on':(s<step && stepValid(s-1)?'done':'');
    const dis=canGo(s)?'':'disabled';
    return `<button class="lane ${cls}" type="button" data-go="${s}" aria-label="Step ${s}: ${t}" ${dis}>${s===6?'✓':s}</button>`;
  }).join('');
}
function render(opts){
  const keep=opts && opts.keepScroll;
  const y=keep?window.scrollY:0;
  paintLanes();
  $('#screen').innerHTML = mode==='tracker' ? planScreen('saved') : SCREENS[step]();
  live();
  window.scrollTo(0, y);
}
function live(){
  const wa=$('#weeksAway');
  if(wa){
    if(!S.dist && !S.raceDate) wa.textContent='Pick a distance and a date.';
    else if(!S.dist) wa.textContent='Pick a distance.';
    else if(!S.raceDate) wa.textContent='Choose your race date.';
    else {
      const n=weeksUntil(S), d=parse(S.raceDate);
      wa.textContent = (n>=2) ? `${n} weeks away (${fmtLong(d)}).` : 'Your race date needs to be at least two weeks away.';
    }
  }
  const po=$('#paceOut');
  if(po){ const p=goalPace(S); po.textContent=p?`That's about ${p} per km.`:'Type it like 1:55 or 4:30.'; }
  const gh=$('#goalHint');
  if(gh) gh.textContent = S.goal ? '' : 'Pick a goal to continue.';
  const nh=$('#nowHint');
  if(nh) nh.textContent = (S.weekly==='' || S.longest==='') ? 'Add both numbers. Zero is fine if you are just starting.' : '';
  const dc=$('#dayCount');
  if(dc) dc.textContent=S.runDays.length<3?'Pick at least three days.':`${S.runDays.length} runs a week.`;
  const rh=$('#rangeHint');
  if(rh){
    const bad=[...S.busy,...S.hols].some(r=>!rangesOk([r]));
    rh.textContent = bad ? 'Each block needs a start and an end, with the end on or after the start.' : '';
  }
  const next=$('#next');
  if(next) next.disabled=!stepValid(step);
}
function refreshAfterEdit(){
  persistDraft();
  const next=$('#next');
  if(next) next.disabled=!stepValid(step);
  paintLanes();
  live();
}

document.addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t) return;
  if(t.id==='next'){
    if(!stepValid(step)) return;
    step=Math.min(6,step+1);
    persistDraft();
    render();
    return;
  }
  if(t.id==='back'){
    step=Math.max(0,step-1);
    persistDraft();
    render();
    return;
  }
  if(t.dataset.go){
    const dest=+t.dataset.go;
    if(!canGo(dest)) return;
    step=dest;
    persistDraft();
    render();
    return;
  }
  if(t.dataset.dist){ S.dist=t.dataset.dist; render({keepScroll:true}); persistDraft(); return; }
  if(t.dataset.goal){ S.goal=t.dataset.goal; render({keepScroll:true}); persistDraft(); return; }
  if(t.dataset.run!==undefined){
    const i=+t.dataset.run;
    S.runDays=S.runDays.includes(i)?S.runDays.filter(x=>x!==i):[...S.runDays,i];
    syncLongDay();
    render({keepScroll:true}); persistDraft(); return;
  }
  if(t.dataset.str!==undefined){
    const i=+t.dataset.str;
    S.strDays=S.strDays.includes(i)?S.strDays.filter(x=>x!==i):[...S.strDays,i];
    render({keepScroll:true}); persistDraft(); return;
  }
  if(t.dataset.add){ S[t.dataset.add].push({from:'',to:''}); render({keepScroll:true}); persistDraft(); return; }
  if(t.dataset.rm){ S[t.dataset.rm].splice(+t.dataset.ri,1); render({keepScroll:true}); persistDraft(); return; }
  if(t.id==='startPlan'){ beginPlan(); return; }
  if(t.id==='askErase'){
    const box=$('#eraseBox');
    if(box) box.innerHTML=`<div class="alert warn"><strong>Erase this plan?</strong> Your answers will be cleared from this phone.
      <div class="nav"><button class="btn primary" id="cancelErase" type="button">Keep it</button><button class="btn ghost" id="doErase" type="button">Erase</button></div></div>`;
    return;
  }
  if(t.id==='cancelErase'){ render({keepScroll:true}); return; }
  if(t.id==='doErase'){ erasePlan(); return; }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='agree'){
    S.agreed=t.checked;
    persistDraft();
    const next=$('#next'); if(next) next.disabled=!S.agreed;
    paintLanes();
    return;
  }
  if(t.id==='raceName') S.raceName=t.value;
  if(t.id==='raceDate') S.raceDate=t.value;
  if(t.id==='goalTime') S.goalTime=t.value;
  if(t.id==='weekly') S.weekly=t.value;
  if(t.id==='longest') S.longest=t.value;
  if(t.id==='injured') S.injured=t.checked;
  if(t.id==='longDay'){ S.longDay=+t.value; S.longDayPicked=true; }
  if(t.dataset.rk) S[t.dataset.rk][+t.dataset.ri][t.dataset.rf]=t.value;
  refreshAfterEdit();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='longDay' || t.type==='date' || t.id==='injured') refreshAfterEdit();
});

function boot(){
  const store=loadStore();
  if(store.agreed) S.agreed=true;
  if(store.answers) applyAnswers(store.answers);
  if(store.agreed) S.agreed=true;
  const plan=hydratePlan(store.plan);
  if(plan){
    savedPlan=plan;
    mode='tracker';
    render();
    return;
  }
  if(Number.isInteger(store.draftStep)) step=Math.min(6, Math.max(0, store.draftStep));
  const open=firstIncomplete();
  if(step>open) step=open;
  render();
}
boot();
</script>
</body>
</html>
